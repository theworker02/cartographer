<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Cartographer">
  <!-- Survey / coordinate mark: geometric C + crosshair -->
  <rect width="64" height="64" rx="14" fill="#0e1c17"/>
  <!-- Outer survey ring -->
  <circle cx="32" cy="32" r="23" stroke="#2f5c4c" stroke-width="1"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="15.5" stroke="#4a7d68" stroke-width="1" opacity="0.85"/>
  <!-- Coordinate C (open east) -->
  <path
    d="M46.2 19.2A17.2 17.2 0 1 0 46.2 44.8"
    stroke="#e7f1eb"
    stroke-width="3.25"
    stroke-linecap="round"
  />
  <!-- Crosshair -->
  <path d="M32 23.5v17M23.5 32h17" stroke="#e7f1eb" stroke-width="1.35" stroke-linecap="round" opacity="0.9"/>
  <circle cx="32" cy="32" r="2.4" fill="#e7f1eb"/>
  <!-- North tick -->
  <path d="M32 6.5l2.1 4.2h-4.2L32 6.5z" fill="#c4a574"/>
</svg>
